name: Job Scraper

# WHY TWO LONG RUNS INSTEAD OF A */10 CRON:
# GitHub heavily throttles high-frequency scheduled workflows on free runners.
# Measured 2026-08-15: a "*/10 8-17 * * 1-5" cron actually fired roughly ONCE
# AN HOUR (08:57, 09:57, 10:54, 11:36, 12:25, 13:50, 14:43, 15:33, 16:27,
# 17:26, 18:14 UTC) and drifted outside its own window. Jobs that close within
# a day were being seen up to an hour late.
#
# Low-frequency crons are fired reliably, so we book TWO runs a day and each
# one stays alive polling every POLL_SECONDS. Public repos have unlimited
# Actions minutes, so ~12h/day of runner time is free.
#   morning block  07:05 UTC -> ~12:55 UTC
#   afternoon block 13:05 UTC -> ~18:55 UTC
# Together that covers 08:00-19:55 UK time in summer (BST), 07:00-18:55 in winter.
on:
  schedule:
    - cron: "5 7 * * 1-5"
    - cron: "5 13 * * 1-5"
  workflow_dispatch:
    inputs:
      single_pass:
        description: "Run once and exit (for manual testing)"
        type: boolean
        default: true

permissions:
  contents: write

# Never let two blocks run at once; the second waits rather than racing
# to commit jobs.txt. Blocks are scheduled not to overlap anyway.
concurrency:
  group: job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # GitHub hard-kills a job at 6h. Stop ourselves just under that.
    timeout-minutes: 355

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for state commits
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Poll for new jobs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          POLL_SECONDS: "600"
          # Leave headroom under the 355-minute timeout so the last cycle and
          # its commit always finish cleanly.
          BLOCK_MINUTES: "345"
          SINGLE_PASS: ${{ github.event_name == 'workflow_dispatch' && inputs.single_pass || 'false' }}
        run: |
          set -u
          END=$(( $(date -u +%s) + BLOCK_MINUTES * 60 ))
          CYCLE=0

          while : ; do
            CYCLE=$(( CYCLE + 1 ))
            echo "::group::cycle $CYCLE at $(date -u +%H:%M:%SZ)"

            # A crash in one cycle must not kill the whole block.
            python job_monitor.py || echo "scraper exited non-zero; continuing"

            # Commit state exactly as before: jobs.txt only if non-empty,
            # plus additions AND deletions of the failure flag.
            if [ -s "jobs.txt" ]; then git add jobs.txt; fi
            git add -A .scraper_failing 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "no state change"
            else
              git commit -m "Update tracker state"
              # Rebase in case a manual run or another block pushed meanwhile.
              git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
              git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed; will retry next cycle"
            fi
            echo "::endgroup::"

            if [ "$SINGLE_PASS" = "true" ]; then
              echo "single pass requested; exiting"
              break
            fi

            NOW=$(date -u +%s)
            # Stop if the next full cycle wouldn't finish inside the block.
            if [ $(( NOW + POLL_SECONDS )) -ge $END ]; then
              echo "block window finished after $CYCLE cycles"
              break
            fi
            sleep "$POLL_SECONDS"
          done
